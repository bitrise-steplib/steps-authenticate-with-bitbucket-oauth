format_version: 1.4.0
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

app:
  envs:
  - RELEASE_VERSION: 0.9.0
  # define these in your .bitrise.secrets.yml
  - USERNAME: $USERNAME
  - ACCESS_TOKEN: $TOKEN
  - STEP_ID_IN_STEPLIB: authenticate-with-bitbucket-oauth

workflows:
  generate-readme:
    steps:
    - git::https://github.com/bitrise-steplib/steps-readme-generator.git@main: { }
  ci:
    steps:
    - git::https://github.com/bitrise-steplib/steps-check.git: { }
    - script:
        title: Backup .netrc
        inputs:
        - content: |-
            set -ex
            if [ -f ~/.netrc ]; then
                mv ~/.netrc ~/.bk.netrc
            fi
    - path::./:
        title: Step Test
        inputs:
        - username: $USERNAME
        - access_token: $ACCESS_TOKEN
    - path::./:
        title: Step Test
        inputs:
        - username: $USERNAME
        - access_token: $ACCESS_TOKEN
    - script:
        title: Output (generated by the Step) tests
        inputs:
        - content: |-
            set -e
            cat ~/.netrc
            echo ""
    - script:
        title: Restore .netrc
        inputs:
        - content: |-
            set -ex
            if [ -f ~/.bk.netrc ]; then
              rm -rf ~/.netrc
              mv ~/.bk.netrc ~/.netrc
            fi
